<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nūr Reader Platform</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Application Styles -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- =====================================
             Sidebar
        ====================================== -->

        <nav class="col-md-3 col-lg-2 bg-success text-white min-vh-100 p-3">

            <h3 class="mb-4">
                📚 Nūr
            </h3>

            <ul class="nav flex-column">

                <li class="nav-item mb-2">
                    <a href="#" class="nav-link text-white" data-view="dashboard">
                        <i class="bi bi-house-door-fill"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="#" class="nav-link text-white" data-view="registration">
                        <i class="bi bi-person-plus-fill"></i>
                        Register Family
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="#" class="nav-link text-white" data-view="families">
                        <i class="bi bi-people-fill"></i>
                        Families
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="#" class="nav-link text-white" data-view="library">
                        <i class="bi bi-book-fill"></i>
                        Library
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="#" class="nav-link text-white" data-view="reader-passports">
                        <i class="bi bi-award-fill"></i>
                        Reader Passports
                    </a>
                </li>

                <li class="nav-item mb-2">
                    <a href="#" class="nav-link text-white" data-view="settings">
                        <i class="bi bi-gear-fill"></i>
                        Settings
                    </a>
                </li>

            </ul>

        </nav>

        <!-- =====================================
             Main Content
        ====================================== -->

        <main class="col-md-9 col-lg-10 p-4">

            <div id="app-content">

                <div class="text-center mt-5">

                    <div class="spinner-border text-success" role="status"></div>

                    <p class="mt-3">

                        Loading Nūr Reader Platform...

                    </p>

                </div>

            </div>

        </main>

    </div>

</div>

<!-- =====================================
     Bootstrap
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- =====================================
     Firebase
====================================== -->

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<!-- =====================================
     Services
====================================== -->

<script src="services/utilities.js"></script>
<script src="services/firebase.js"></script>
<script src="services/idService.js"></script>

<!-- =====================================
     Modules
====================================== -->

<script src="modules/dashboard.js"></script>
<script src="modules/registration.js"></script>
<script src="modules/families.js"></script>

<!-- =====================================
     Application
====================================== -->

<script src="js/app.js"></script>

</body>

</html>
