<h1>Register Family</h1>

<p class="text-muted">
Register a parent or guardian together with one or more readers.
</p>

<hr>

<form id="registration-form">

    <!-- Parent Information -->

    <div class="card mb-4">

        <div class="card-header">
            Parent / Guardian Information
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Parent / Guardian Name</label>
                    <input
                        type="text"
                        class="form-control"
                        id="parentName"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input
                        type="tel"
                        class="form-control"
                        id="mobile">
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email Address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Residential Area</label>
                    <input
                        type="text"
                        class="form-control"
                        id="suburb">
                </div>

            </div>

        </div>

    </div>

    <!-- Children -->

    <h4 class="mb-3">
        Readers
    </h4>

    <div id="children-container"></div>

    <button
        type="button"
        class="btn btn-outline-success mt-3"
        id="addChildButton">

        <i class="bi bi-plus-circle"></i>

        Add Reader

    </button>

    <hr>

    <button
        type="submit"
        class="btn btn-success btn-lg">

        <i class="bi bi-floppy"></i>

        Save Registration

    </button>

</form>
